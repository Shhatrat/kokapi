<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 90" width="270" height="90">
  <defs>
    <linearGradient id="pg" x1="14" y1="10" x2="66" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#E44857"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#E44857"/>
    </linearGradient>
  </defs>

  <!-- Pin shadow -->
  <ellipse cx="42" cy="84" rx="9" ry="3" fill="rgba(0,0,0,0.18)"/>

  <!-- Pin tail (triangle covered by circle on top) -->
  <path d="M 24 36 L 40 78 L 56 36" fill="url(#pg)"/>
  <!-- Pin bubble -->
  <circle cx="40" cy="35" r="26" fill="url(#pg)"/>

  <!-- White inner circle -->
  <circle cx="40" cy="35" r="14" fill="white"/>

  <!-- K inside pin -->
  <text x="40" y="42" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="18" font-weight="900" fill="#7F52FF">K</text>

  <!-- KoKAPI text -->
  <text y="61" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">
    <tspan x="83" fill="#1a1a2e">Ko</tspan><tspan fill="url(#tg)">KAPI</tspan>
  </text>
</svg>
